# Rebuilds public/data/bandung-graph.json from OpenStreetMap when the graph builder changes,
# or by hand (Actions tab > Build road graph > Run workflow) to refresh OSM data before the demo.
name: Build road graph
on:
  workflow_dispatch:
  push:
    paths: ['scripts/build-graph.ts', 'src/core/osm.ts', '.github/workflows/build-graph.yml']
permissions:
  contents: write
jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build-graph
      - name: Commit graph if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add public/data/bandung-graph.json
          git diff --cached --quiet || (git commit -m "Rebuild road graph from OpenStreetMap" && git push)
